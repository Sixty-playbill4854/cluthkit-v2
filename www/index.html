<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121214">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>ClutchKit</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="logo"><span class="bolt">&#9889;</span> CLUTCH<b>KIT</b></div><div id="sub" class="sub"></div></header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="session">Session</button>
  <button data-tab="profiles">Profiles</button>
  <button data-tab="history">History</button>
  <button data-tab="data">Data</button>
</nav>
<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept=".json,application/json,text/plain" hidden>
<script src="app.js"></script>
</body>
</html>
